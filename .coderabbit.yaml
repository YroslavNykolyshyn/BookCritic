# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

tone_instructions: >
  Be concise, practical, and technically precise. Prioritize correctness,
  data integrity, security, lifecycle safety, and meaningful performance issues.
  Avoid speculative suggestions and low-value style nitpicks.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true

  auto_review:
    enabled: true
    drafts: false
    incremental_reviews: true

  # Ignore generated output and dependency lockfiles. Keep Gradle build files
  # and the version catalog reviewable because dependency changes matter.
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/generated/**"
    - "!**/*.lock"
    - "!**/local.properties"

  path_instructions:
    - path: "**/*"
      instructions: |
        Project context:
        - This is BookCritic, an offline-first Android book journal.
        - The app is built with Kotlin, Jetpack Compose, Material 3, Coroutines/Flow,
          Room, Hilt, Coil 3, and Navigation 3.
        - The presentation layer uses ViewModels and immutable UI state with
          action/event handling.
        - The app currently stores user data locally. Do not assume authentication,
          cloud sync, or a backend exists or is required.
        - Book cover images are stored as files in app-private storage. Room should
          store a path/reference, not image byte arrays. Photo Picker and camera URIs
          may be temporary; copy selected images into app-owned storage before
          relying on them later.

        Review priorities:
        1. Find real bugs, crashes, data loss, security/privacy problems, lifecycle
           issues, and incorrect behavior before style improvements.
        2. Check coroutine cancellation, dispatcher usage, Flow collection,
           duplicate collection, and lifecycle-aware UI observation.
        3. Check that Composables remain UI-focused. Business logic and persistence
           belong in ViewModels/repositories/data sources as appropriate.
        4. Check immutable UI state updates and ensure loading, empty, success, and
           error states are handled consistently.
        5. Check Room queries, transactions, type converters, schema changes, and
           migration safety. Never suggest destructive migrations for user data
           without explicitly explaining the data-loss consequence.
        6. Check file operations for cleanup, failure handling, path safety, and
           consistency between database records and stored files.
        7. Check image loading for null/invalid models, large image memory usage,
           unnecessary recomposition/subcomposition, and temporary URI permissions.
        8. Check dependency injection scopes and module boundaries. Avoid introducing
           abstractions or modules without a concrete benefit.
        9. Check accessibility, content descriptions, touch targets, and adaptive
           layouts in Compose UI.
        10. Check tests for meaningful behavior and edge cases. Follow the project's
            existing testing libraries and conventions rather than adding new
            dependencies without a reason.

        Do not:
        - Report formatting, import ordering, naming preferences, or minor stylistic
          differences unless they cause a concrete problem.
        - Recommend replacing an established project pattern merely because another
          pattern is also valid.
        - Suggest adding authentication, networking, analytics, or cloud sync unless
          the change explicitly requires it.
        - Treat every nullable value as a bug; assess whether null is a valid state.
        - Request tests for trivial getters, data holders, or generated code.
        - Repeat the same finding in multiple comments.
        - Make claims about APIs or library behavior unless supported by the code
          context or known framework behavior.

    - path: "**/*ViewModel.kt"
      instructions: |
        Review state ownership and event handling. Ensure UI state is exposed
        read-only and updated consistently. Check coroutine scope, cancellation,
        dispatcher choice, exception handling, and duplicate Flow collectors.
        Avoid Android View or Activity references in ViewModels. Keep business
        decisions out of Composables and avoid moving simple UI-only state into
        a ViewModel without a reason.

    - path: "**/ui/**"
      instructions: |
        Review Compose code for correct state handling, lifecycle-aware Flow
        collection, stable list keys, accessibility, and sensible recomposition.
        Keep Composables focused on rendering and UI events. Use remember for
        transient UI state and effects only for side effects. Avoid unnecessary
        SubcomposeAsyncImage when AsyncImage is sufficient. Do not flag
        reasonable use of Material 3 defaults as a defect.

    - path: "**/*Dao.kt"
      instructions: |
        Review Room queries for correctness, parameter binding, appropriate
        indexes where justified, and Flow invalidation behavior. Check whether
        multi-step database changes need a transaction. Avoid destructive
        migration suggestions and verify schema compatibility.

    - path: "**/*Entity.kt"
      instructions: |
        Review Room entity fields, nullability, primary keys, indices, relations,
        and type-converter compatibility. Consider backward-compatible schema
        evolution and preservation of existing user data.

    - path: "**/*Repository*.kt"
      instructions: |
        Check repository contracts, data mapping, error propagation, and
        consistency across data sources. For operations involving both Room
        records and cover files, consider partial failures and orphaned files.
        Keep Android UI concerns out of repositories.

    - path: "**/*Storage*.kt"
      instructions: |
        Review file handling for app-private storage boundaries, safe filenames,
        path traversal, stream closure, dispatcher usage, partial-write cleanup,
        and failure behavior. Do not persist temporary picker URIs as durable
        cover references. Consider image size and format validation.

    - path: "**/src/test/**"
      instructions: |
        Review whether tests verify observable behavior and important edge
        cases. Check coroutine and Flow test determinism, cleanup, and isolation.
        Follow existing project test libraries and patterns; do not demand a
        new mocking or assertion library without a clear benefit.

    - path: "**/*.gradle"
      instructions: |
        Review Gradle changes for plugin and dependency compatibility, correct
        module boundaries, version-catalog consistency, and unnecessary
        dependencies. Do not suggest hardcoding versions when the project uses
        a version catalog.

    - path: "**/*.gradle.kts"
      instructions: |
        Review Gradle changes for plugin and dependency compatibility, correct
        module boundaries, version-catalog consistency, and unnecessary
        dependencies. Do not suggest hardcoding versions when the project uses
        a version catalog.
